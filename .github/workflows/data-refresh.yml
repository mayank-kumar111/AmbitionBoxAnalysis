name: AmbitionBox Data Refresh

on:
  workflow_dispatch:
    inputs:
      extended:
        description: "Scrape the extended location set"
        required: false
        default: false
        type: boolean
      pages:
        description: "Pages per location"
        required: false
        default: "1"
        type: string
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite quality gate
        run: python -m pytest -q

      - name: Run deterministic ingestion E2E gate
        run: python -m pytest -q tests/test_e2e_pipeline.py

      - name: Restore latest history database
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p data
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ambitionbox-history-db&per_page=1" --jq '.artifacts[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > /tmp/history.zip
            unzip -o /tmp/history.zip -d /tmp/history_restore
            if [ -f /tmp/history_restore/ambitionbox.db ]; then
              cp /tmp/history_restore/ambitionbox.db data/ambitionbox.db
            fi
          fi

      - name: Backup existing history database
        if: ${{ hashFiles('data/ambitionbox.db') != '' }}
        run: |
          mkdir -p data/backups
          python scripts/backup_database.py \
            --database data/ambitionbox.db \
            --backup data/backups/ambitionbox-${{ github.run_number }}.db

      - name: Backup master dataset before refresh
        run: |
          mkdir -p data/backups/master
          python scripts/master_backup.py \
            --master ambitionbox_app/data/companies.csv \
            --backup-dir data/backups/master

      - name: Collect snapshot
        env:
          EXTENDED: ${{ inputs.extended }}
          PAGES: ${{ inputs.pages }}
        shell: bash
        run: |
          if [ -z "$PAGES" ]; then PAGES=1; fi
          command=(python scripts/collect_and_update.py
            --master ambitionbox_app/data/companies.csv
            --output data/processed/companies_updated.csv
            --report reports/update_report.json
            --pages "$PAGES")
          if [ "$EXTENDED" = "true" ]; then command+=(--extended); fi
          "${command[@]}"

      - name: Verify post-refresh dataset
        if: success()
        run: |
          python scripts/verify_master_dataset.py \
            --master data/processed/companies_updated.csv \
            --minimum-rows 1

      - name: Publish GitHub refresh summary
        if: always()
        run: |
          if [ -f reports/update_report.json ]; then
            python scripts/github_summary.py reports/update_report.json
          else
            echo "No refresh report was produced."
          fi

      - name: Send alert notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f reports/update_report.json ]; then
            python scripts/notify_refresh.py reports/update_report.json
          else
            echo "No refresh report was produced; notification skipped."
          fi

      - name: Persist SQLite history snapshot
        if: success()
        run: |
          snapshot_dir="$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/update_report.json").read_text(encoding="utf-8"))
          print(report["incoming_directory"])
          PY
          )"
          python scripts/refresh_history.py \
            --master ambitionbox_app/data/companies.csv \
            --incoming "$snapshot_dir" \
            --database data/ambitionbox.db \
            --report reports/history_refresh.json

      - name: Validate persisted history database
        if: success()
        run: |
          backup="data/backups/ambitionbox-${{ github.run_number }}.db"
          if [ -f "$backup" ]; then
            python scripts/validate_and_restore_database.py \
              --database data/ambitionbox.db \
              --backup "$backup"
          else
            python - <<'PY'
            import sqlite3
            from pathlib import Path
            db = Path("data/ambitionbox.db")
            with sqlite3.connect(db) as connection:
                result = connection.execute("PRAGMA integrity_check").fetchone()[0]
            if str(result).lower() != "ok":
                raise SystemExit(f"SQLite integrity check failed: {result}")
            print("SQLite database integrity check: ok")
            PY
          fi

      - name: Restore database after history failure
        if: failure()
        shell: bash
        run: |
          backup="data/backups/ambitionbox-${{ github.run_number }}.db"
          if [ -f "$backup" ]; then
            python scripts/validate_and_restore_database.py \
              --database data/ambitionbox.db \
              --backup "$backup" \
              --force
          else
            echo "No pre-refresh database backup exists; nothing to restore."
          fi

      - name: Upload persistent history database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitionbox-history-db
          path: data/ambitionbox.db
          if-no-files-found: warn
          retention-days: 90

      - name: Upload database backup
        if: ${{ hashFiles('data/backups/*.db') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ambitionbox-history-backup-${{ github.run_number }}
          path: data/backups/*.db
          if-no-files-found: error
          retention-days: 30

      - name: Upload master dataset backup
        if: ${{ hashFiles('data/backups/master/*.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ambitionbox-master-backup-${{ github.run_number }}
          path: data/backups/master/*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload refresh reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambitionbox-refresh-${{ github.run_number }}
          path: |
            data/incoming/
            reports/update_report.json
            reports/history_refresh.json
          if-no-files-found: warn
          retention-days: 14
